name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build (release)
        run: swift build -c release

      - name: Run tests (includes the empty-environment stdio start, skills and approval log)
        run: swift test

      - name: Check release binary starts, lists 24 tools by default, and serves 5 skill prompts
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' > /tmp/in.jsonl
          (cat /tmp/in.jsonl; sleep 1; printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'; sleep 1; printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 1; printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"prompts/list"}'; sleep 2) | env -i PATH=/usr/bin:/bin HOME=/tmp .build/release/Bench 2>/dev/null > /tmp/out.jsonl
          python3 -c "import json; L=[json.loads(l) for l in open('/tmp/out.jsonl') if l.strip()]; by={x.get('id'):x for x in L}; assert by[1]['result']['serverInfo']['version']=='0.4.0'; assert len(by[2]['result']['tools'])==24; assert len(by[3]['result']['prompts'])==5; print('ok')"

      - name: Check the tool and prompt lock
        run: python3 scripts/tool_lock.py --check --binary .build/release/Bench

      - name: Check the security card is current
        run: python3 scripts/security_card.py --check --binary .build/release/Bench

      - name: Check skills (license, source, credit, no site links in bodies)
        run: python3 scripts/check_skills.py

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The gitleaks CLI is free; the GitHub Action needs a license for organization repos.
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Identifier scan
        env:
          IDENTIFIER_PATTERNS: ${{ secrets.IDENTIFIER_PATTERNS }}
        run: python3 scripts/scan_identifiers.py .
